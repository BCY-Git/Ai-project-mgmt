services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_mid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_project_mgmt}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - mid_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_project_mgmt}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - mid_network

  redis:
    image: redis:7-alpine
    container_name: ai_mid_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - mid_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - mid_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_mid_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-3001}
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-3001}/api/v1 >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
    networks:
      - mid_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_mid_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 8
    networks:
      - mid_network

volumes:
  mid_postgres_data:
  mid_redis_data:

networks:
  mid_network:
    driver: bridge
